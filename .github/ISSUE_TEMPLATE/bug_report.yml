name: Bug report
description: Something behaves differently than the README says it does.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Losing text is the bug that matters most here. If that is what happened,
        say so first — what you typed and when the tab closed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Click the Scratchpad icon
        2. …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: From `chrome://extensions`, or the commit you built from.
      placeholder: '1.0.0'
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version and OS
      placeholder: 'Chrome 141, macOS 15'
    validations:
      required: true
  - type: textarea
    id: draft
    attributes:
      label: The draft that triggers it, if the preview is involved
      description: Paste the markdown. It helps most for maths, mermaid or embedded HTML.
      render: markdown
    validations:
      required: false
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Right-click the scratchpad page, Inspect, Console tab.
      render: text
    validations:
      required: false
