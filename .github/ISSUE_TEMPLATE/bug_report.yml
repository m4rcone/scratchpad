name: Bug report
description: Something does not work as the README describes.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Lost text is the most serious bug here. If that happened, say so first:
        what you typed and when the tab closed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Click the Scratchpad icon
        2. …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: From `chrome://extensions`, or the commit you built from.
      placeholder: '1.5.0'
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version and OS
      placeholder: 'Chrome 141, macOS 15'
    validations:
      required: true
  - type: textarea
    id: draft
    attributes:
      label: Draft that triggers it
      description: For preview issues, paste the markdown — especially maths, mermaid or embedded HTML.
      render: markdown
    validations:
      required: false
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Right-click the page, choose Inspect, then open the Console tab.
      render: text
    validations:
      required: false
