name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: lint, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Extension build
        run: npm run build

      - name: Check the manifest made it into dist
        run: test -f dist/manifest.json && test -f dist/pad/index.html && test -f dist/background.js

      # The release workflow refuses a tag whose versions disagree; catching it
      # here means finding out on the PR, not on the tag.
      - name: Check both manifests carry the same version
        run: |
          manifest="$(node -p "require('./public/manifest.json').version")"
          package="$(node -p "require('./package.json').version")"
          if [ "$manifest" != "$package" ]; then
            echo "::error::package.json says $package, manifest.json says $manifest"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: unpacked-extension
          path: dist
          if-no-files-found: error
